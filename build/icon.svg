<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e1b2e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#sheen)"/>

  <!-- clipboard -->
  <g filter="url(#shadow)">
    <rect x="132" y="120" width="248" height="300" rx="34" fill="#ffffff"/>
    <!-- clip -->
    <rect x="214" y="96" width="84" height="52" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="10"/>
  </g>

  <!-- checklist lines -->
  <g>
    <circle cx="182" cy="212" r="15" fill="#22c55e"/>
    <path d="M175 212 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="203" width="128" height="18" rx="9" fill="#c4b5fd"/>

    <circle cx="182" cy="270" r="15" fill="#22c55e"/>
    <path d="M175 270 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="261" width="128" height="18" rx="9" fill="#c4b5fd"/>

    <circle cx="182" cy="328" r="15" fill="#a78bfa"/>
    <rect x="212" y="319" width="96" height="18" rx="9" fill="#ddd6fe"/>
  </g>
</svg>
